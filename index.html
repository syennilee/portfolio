<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syenni Lee — Portfolio</title>
<meta name="description" content="Syenni Lee — content marketer for K-beauty and K-culture, Korean · English · Indonesian.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="blobs" aria-hidden="true"><div class="blob" id="b0"></div><div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div><div class="blob" id="b4"></div></div>
<div id="glow" aria-hidden="true"></div><div id="dot" aria-hidden="true"></div>
<div id="pop" class="lt" aria-hidden="true"></div>

<header class="topbar container">
  <div class="tb-left">
    <span class="h" id="brand"></span>
    <span class="seg glass" id="segN"><span class="thumb"></span><span class="sb" id="nA" role="button" tabindex="0"></span><span class="sb" id="nC" role="button" tabindex="0"></span></span>
  </div>
  <div class="tb-right">
    <span class="seg glass" id="segP"><span class="thumb"></span><span class="sb on" id="tA" role="button" tabindex="0"></span><span class="sb" id="tB" role="button" tabindex="0"></span></span>
    <span class="seg glass" id="segL"><span class="thumb"></span><span class="sb on" id="en" role="button" tabindex="0">EN</span><span class="sb" id="kr" role="button" tabindex="0">KR</span></span>
  </div>
</header>

<main>
  <!-- BEAUTY PAGE -->
  <section id="A" class="pg container">
    <div id="hero" class="glass">
      <div class="hero-top">
        <h1 class="h name">Syenni Lee</h1>
        <p class="kicker" id="kA"></p>
      </div>
      <p class="ing-label" id="ingL"></p>
      <div class="tk-wrap"><div class="tk" id="r1"></div></div>
      <div class="tk-wrap"><div class="tk" id="r2"></div></div>
      <div class="hero-bottom">
        <p class="tag" id="tagA"></p>
        <div id="ingd" class="glass"></div>
      </div>
    </div>
    <div class="sec-head"><p class="h">PRODUCT LINE</p><p class="hint" id="plh"></p></div>
    <div id="plist" class="glass"></div>
    <div id="toolsA" class="tc lt glass full"></div>
  </section>

  <!-- CONTENT & CULTURE PAGE -->
  <section id="B" class="pg" hidden>
    <div id="discWrap"><div id="disc"><div class="label"></div></div></div>
    <div class="container bgrid">
      <div class="bleft">
        <p class="kicker" id="kB"></p>
        <h1 class="h name">Syenni Lee</h1>
        <p class="tag" id="tagB"></p>
        <div class="sec-head"><p class="h" id="tlT"></p><p class="hint" id="tlh"></p></div>
        <div id="tl"></div>
        <p class="h oth-h" id="bnh"></p>
        <div id="bl"></div>
        <div id="toolsB" class="tc dk stack"></div>
      </div>
      <div class="bright">
        <div class="glass playlist">
          <div class="pl-head"><span><i class="ti ti-playlist" aria-hidden="true"></i><span id="onrep"></span></span><span id="np"></span></div>
          <div id="pl"></div>
        </div>
        <div class="player">
          <span id="pp" role="button" tabindex="0" aria-label="Pause"><i class="ti ti-player-pause" aria-hidden="true"></i></span>
          <div id="wv"></div>
          <span id="tm">01</span>
        </div>
      </div>
    </div>
  </section>

  <!-- ABOUT / CONTACT / PROJECT PAGES -->
  <section id="sub" class="pg container" hidden></section>
</main>

<footer class="container foot"><span>© 2026 Syenni Lee</span></footer>

<script src="js/content.js"></script>
<script src="js/main.js"></script>
</body>
</html>
